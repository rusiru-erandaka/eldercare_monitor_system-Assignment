[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eldercare-monitor"
version = "0.1.0"
description = "Fixed-camera eldercare activity analysis with OpenVINO"
readme = "README.md"
requires-python = "==3.14.4"
dependencies = [
  "numpy==2.5.3",
  "opencv-python==5.0.0.93",
  "openvino==2026.4.0",
  "openvino-model-api==0.4.7",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
vlm = ["google-genai>=2.28,<3"]

[project.scripts]
eldercare = "eldercare.run:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
include = ["eldercare*"]
