[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eldercare-monitor"
version = "0.1.0"
description = "Fixed-camera eldercare activity analysis with OpenVINO"
readme = "README.md"
requires-python = "==3.14.4"
dependencies = [
  "numpy==2.5.3",
  "opencv-python==5.0.0.93",
  "openvino==2026.4.0",
  "openvino-model-api==0.4.7",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
vlm = ["google-genai>=2.28,<3"]

[project.scripts]
eldercare = "eldercare.run:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
include = ["eldercare*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing compact tests are left untouched in behavior-preserving Phase 0.
"tests/test_evaluate.py" = ["E401", "E702"]
"tests/test_perception.py" = ["E701", "E731", "F401"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"
# Expand to legacy modules after their pre-existing typing errors are resolved.
files = ["eldercare/config.py", "eldercare/models.py", "eldercare/provenance.py", "eldercare/logging_utils.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: model-free unit test",
  "needs_models: requires the pinned local OpenVINO XML/BIN files",
  "slow: takes materially longer than a normal unit test",
]
